# MedSest Visita — configuração Nginx (produção)
# Copiar para /etc/nginx/sites-available/medsest e criar symlink em sites-enabled.
# ⚠️ Trocar `app.medsest.com.br` pelo domínio real antes de usar.

server {
    listen 80;
    server_name app.medsest.com.br;
    # O certbot injeta aqui o desafio ACME; o resto redireciona para HTTPS.
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.medsest.com.br;

    ssl_certificate /etc/letsencrypt/live/app.medsest.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.medsest.com.br/privkey.pem;

    # Fotos podem ser grandes; o backend valida o limite real (MAX_FILE_SIZE_MB).
    client_max_body_size 50M;

    # Compressão dos assets de texto (JS/CSS/JSON) — 1ª carga mais leve no celular.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cabeçalhos de segurança básicos.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Service worker / manifest: NUNCA cachear (senão o app trava numa versão) ---
    # O vite-plugin-pwa gera sw.js e registerSW.js.
    location ~* (sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        root /var/www/medsest/frontend;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # --- Assets com hash no nome: podem cachear por muito tempo (imutáveis) ---
    location /assets/ {
        root /var/www/medsest/frontend;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- Frontend (SPA): tudo que não for arquivo cai no index.html ---
    location / {
        root /var/www/medsest/frontend;
        try_files $uri $uri/ /index.html;
    }

    # --- Proxy reverso para a API FastAPI (uvicorn em 127.0.0.1:8000) ---
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # --- Fotos e assinaturas enviadas (servidas do disco, imutáveis por uuid) ---
    location /uploads/ {
        alias /var/www/medsest/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
